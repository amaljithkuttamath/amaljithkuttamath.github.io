# Regenerate the long tail of Chitti's knowledge base from the World Bank
# catalogue.
#
# The knowledge base is what makes find_series resolve "child mortality" to an
# under-5 series. Its hand-tuned core lives in src/lib/chitti/kb.ts and is NOT
# touched here; this refreshes only src/data/chitti/kb.json — the thousand-odd
# indicators built from the World Bank API's own topic and description
# metadata. No model is involved: the source publishes the prose, we fetch it.
#
# The job that matters is the validation. A catalogue refresh could in principle
# shift retrieval, so the suite — which carries the retrieval eval as a
# regression table, including a case asserting the eval still holds WITH a
# generated tier present — runs against the regenerated file before any PR is
# opened. A refresh that would break retrieval fails here instead of landing.
#
# Run it from the Actions tab. It never pushes to main.
name: Refresh Chitti knowledge base

on:
  workflow_dispatch:
  # To run it on a schedule as the catalogue grows, uncomment (first of the
  # month, 05:00 UTC). Left off by default so the repo doesn't accrue unread PRs.
  # schedule:
  #   - cron: '0 5 1 * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-chitti-kb
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Keep the committed version to compare against later.
      - name: Snapshot the current knowledge base
        run: git show HEAD:src/data/chitti/kb.json > "$RUNNER_TEMP/kb-before.json"

      # The generator exits non-zero (and writes nothing) if the catalogue fetch
      # fails or comes back implausibly small, so a red step here means the
      # knowledge base was left exactly as it was.
      - name: Fetch the World Bank catalogue
        run: npm run kb:refresh

      # The PR this job opens is created with GITHUB_TOKEN, and GitHub does not
      # run `on: pull_request` workflows for such PRs — so CI will NOT run on it.
      # That makes these two steps the real gate: the suite re-runs the retrieval
      # eval against the regenerated knowledge base (the authored core must still
      # win, and every pinned query must still resolve), and the build proves the
      # file still bundles inside its size budget.
      - run: npx vitest run
      - run: npm run build

      # Every run rewrites `generated`, so a plain diff is never empty. Compare
      # with that field stripped, and only open a PR when the CATALOGUE moved.
      - name: Decide whether the data changed
        id: diff
        run: |
          node -e "
            const fs = require('fs');
            const strip = (p) => JSON.stringify(
              JSON.parse(fs.readFileSync(p, 'utf8')),
              (k, v) => (k === 'generated' ? undefined : v)
            );
            const before = strip(process.env.RUNNER_TEMP + '/kb-before.json');
            const after = strip('src/data/chitti/kb.json');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'changed=' + (before !== after) + '\n');
          "

      - name: Open a pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: chore/refresh-chitti-kb
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # One long-lived branch: a second run force-pushes onto it and updates
          # the open PR instead of stacking a new one. Fetch it first so
          # --force-with-lease has a remote-tracking ref to compare against and
          # can still refuse if someone else moved the branch.
          git fetch origin "$BRANCH" || true
          git checkout -B "$BRANCH"
          git add src/data/chitti/kb.json
          git commit \
            -m "Chitti: refresh the knowledge-base catalogue" \
            -m "Regenerated by .github/workflows/refresh-chitti-kb.yml from the World Bank indicator API. The hand-tuned core in kb.ts is untouched."
          git push --force-with-lease origin "$BRANCH"

          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "PR already open for $BRANCH — force-pushed the refreshed data to it."
            exit 0
          fi

          # Body via a file rather than an inline --body, so the markdown needs
          # no shell escaping and backticks stay literal.
          cat > "$RUNNER_TEMP/pr-body.md" <<'BODY'
          Regenerated by the `Refresh Chitti knowledge base` workflow from the World Bank indicator API by `scripts/gen-chitti-kb.mjs`. Topics and descriptions are the institution's own published metadata — no model wrote any of it, and the hand-tuned core in `src/lib/chitti/kb.ts` is untouched.

          The full suite — including the retrieval eval, and the case asserting that eval still holds with a generated tier present — plus a production build ran against this file on the runner before the PR was opened. Note that CI does **not** re-run on this PR: it was created with `GITHUB_TOKEN`, and GitHub does not trigger `pull_request` workflows for those.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_
          BODY

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Chitti: refresh the knowledge-base catalogue" \
            --body-file "$RUNNER_TEMP/pr-body.md"

      - name: Report no change
        if: steps.diff.outputs.changed != 'true'
        run: echo "The catalogue is unchanged — nothing to open a PR for."
