# Regenerate Chitti's empty-state demo answers.
#
# The demos are pre-fetched, real, cited answers shown to visitors who have not
# connected an API key (see src/lib/chitti/demos.ts). Their numbers must come
# from the source APIs, never from an author's keyboard, so the only supported
# way to update src/data/chitti/demos.json is to run the generator against the
# live World Bank / Our World in Data APIs — which needs outbound network a
# local sandbox may not have, but a GitHub runner does.
#
# Run it from the Actions tab. It fetches, validates, and opens a pull request
# with the result; it never pushes to main.
name: Refresh Chitti demos

on:
  workflow_dispatch:
  # To run it on a schedule as the data ages, uncomment (first of the month,
  # 04:00 UTC). Left off by default so the repo doesn't accrue unread PRs.
  # schedule:
  #   - cron: '0 4 1 * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-chitti-demos
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Keep the committed version to compare against later.
      - name: Snapshot the current demos
        run: git show HEAD:src/data/chitti/demos.json > "$RUNNER_TEMP/demos-before.json"

      # The generator exits non-zero (and writes nothing) if any fetch fails or
      # returns too little data, so a red step here means no demos were changed.
      - name: Fetch fresh demo answers
        run: npm run demos:refresh

      # The PR this job opens is created with GITHUB_TOKEN, and GitHub does not
      # run `on: pull_request` workflows for such PRs — so CI will NOT run on it.
      # That makes these two steps the real gate: the suite's shipped-demos
      # assertions check whatever was just written (provenance on every demo, no
      # invented verification verdict, nothing lost to validation), and the build
      # proves the regenerated file still bundles.
      - run: npx vitest run
      - run: npm run build

      # Every run rewrites `generated` and each citation's `fetchedAt`, so a
      # plain diff is never empty. Compare with those volatile fields stripped,
      # and only open a PR when the DATA actually moved.
      - name: Decide whether the data changed
        id: diff
        run: |
          node -e "
            const fs = require('fs');
            const strip = (p) => JSON.stringify(
              JSON.parse(fs.readFileSync(p, 'utf8')),
              (k, v) => (k === 'generated' || k === 'fetchedAt' ? undefined : v)
            );
            const before = strip(process.env.RUNNER_TEMP + '/demos-before.json');
            const after = strip('src/data/chitti/demos.json');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'changed=' + (before !== after) + '\n');
          "

      - name: Open a pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: chore/refresh-chitti-demos
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # One long-lived branch: a second run force-pushes onto it and updates
          # the open PR instead of stacking a new one. Fetch it first so
          # --force-with-lease has a remote-tracking ref to compare against and
          # can still refuse if someone else moved the branch.
          git fetch origin "$BRANCH" || true
          git checkout -B "$BRANCH"
          git add src/data/chitti/demos.json
          git commit \
            -m "Chitti: refresh the empty-state demo answers" \
            -m "Regenerated by .github/workflows/refresh-chitti-demos.yml — every number re-fetched from the source APIs, never authored."
          git push --force-with-lease origin "$BRANCH"

          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "PR already open for $BRANCH — force-pushed the refreshed data to it."
            exit 0
          fi

          # Body via a file rather than an inline --body, so the markdown needs
          # no shell escaping and backticks stay literal.
          cat > "$RUNNER_TEMP/pr-body.md" <<'BODY'
          Regenerated by the `Refresh Chitti demos` workflow. Every number here was re-fetched from the World Bank / Our World in Data APIs by `scripts/gen-chitti-demos.mjs` — none of it is hand-written.

          The test suite and a production build ran against this file on the runner before the PR was opened. Note that CI does **not** re-run on this PR: it was created with `GITHUB_TOKEN`, and GitHub does not trigger `pull_request` workflows for those.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_
          BODY

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Chitti: refresh the empty-state demo answers" \
            --body-file "$RUNNER_TEMP/pr-body.md"

      - name: Report no change
        if: steps.diff.outputs.changed != 'true'
        run: echo "Sources returned the same data — nothing to open a PR for."
