# TEMPORARY diagnostic — delete once the World Bank 400 is understood.
#
# The demo generator failed on the runner with a bare `World Bank API HTTP 400`
# and the sandbox this was written in cannot reach api.worldbank.org at all
# (every data host is refused at CONNECT by policy), so the failing request
# cannot be reproduced locally. Rather than guess at a fix, this probes the
# exact request shapes the generator builds and prints what the API says to
# each — on a runner, which does have network.
#
# Scoped to one branch and triggered by push, so it needs no dispatch
# permission. It writes nothing and touches no data.
#
# Every request carries a 20s deadline. The first version of this file had none
# and stalled past five minutes on one case — an unbounded request, which is the
# very bug this session had already fixed in the app. A diagnostic that can hang
# tells you nothing; bounding each case is what makes a slow host distinguishable
# from a rejected request.
name: TMP probe World Bank

on:
  push:
    branches: [claude/chitti-usefulness-review-ixwnbg]

permissions:
  contents: read

# One probe at a time: a degraded API is not helped by two runs of this racing.
concurrency:
  group: tmp-probe-worldbank
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Probe the request shapes the generator builds
        run: |
          node -e "
            const fs = require('fs');
            const WB = 'https://api.worldbank.org/v2';
            const countries = JSON.parse(fs.readFileSync('src/data/worldbank/countries.json', 'utf8'))
              .filter((c) => c.region && c.region !== 'Aggregates')
              .map((c) => c.id);
            console.log('real countries in the bundled table:', countries.length);
            const year = new Date().getFullYear();

            // Each case isolates ONE variable against the shape that failed:
            // SH.DYN.MORT, the first 60-country batch, date=2000:<thisYear>,
            // per_page=2000 — which is exactly what fetchWorldbankAll sends.
            const cases = [
              ['1 country, no dates',            \`\${WB}/country/IND/indicator/SH.DYN.MORT?format=json&per_page=2000\`],
              ['1 country, dated',               \`\${WB}/country/IND/indicator/SH.DYN.MORT?format=json&date=2000:\${year}&per_page=2000\`],
              ['60 countries, no dates',         \`\${WB}/country/\${countries.slice(0,60).join(';')}/indicator/SH.DYN.MORT?format=json&per_page=2000\`],
              ['60 countries, dated  <-- FAILING SHAPE', \`\${WB}/country/\${countries.slice(0,60).join(';')}/indicator/SH.DYN.MORT?format=json&date=2000:\${year}&per_page=2000\`],
              ['50 countries, dated',            \`\${WB}/country/\${countries.slice(0,50).join(';')}/indicator/SH.DYN.MORT?format=json&date=2000:\${year}&per_page=2000\`],
              ['30 countries, dated',            \`\${WB}/country/\${countries.slice(0,30).join(';')}/indicator/SH.DYN.MORT?format=json&date=2000:\${year}&per_page=2000\`],
              ['60 countries, dated, per_page=1000', \`\${WB}/country/\${countries.slice(0,60).join(';')}/indicator/SH.DYN.MORT?format=json&date=2000:\${year}&per_page=1000\`],
              ['60 countries, date ending 2024', \`\${WB}/country/\${countries.slice(0,60).join(';')}/indicator/SH.DYN.MORT?format=json&date=2000:2024&per_page=2000\`],
              ['WDI catalogue page 1',           \`\${WB}/indicator?format=json&per_page=500&source=2&page=1\`],
            ];

            (async () => {
              for (const [label, url] of cases) {
                const t0 = Date.now();
                try {
                  const r = await fetch(url, { signal: AbortSignal.timeout(20000) });
                  const body = await r.text();
                  let shape = '(unparseable)';
                  try {
                    const j = JSON.parse(body);
                    shape = Array.isArray(j) && Array.isArray(j[1])
                      ? \`rows=\${j[1].length} total=\${j[0] && j[0].total} pages=\${j[0] && j[0].pages}\`
                      : 'body=' + body.replace(/\\s+/g,' ').slice(0,160);
                  } catch { shape = 'body=' + body.replace(/\\s+/g,' ').slice(0,160); }
                  console.log(\`[\${r.status}] \${String(Date.now()-t0).padStart(5)}ms  \${label}\`);
                  console.log('        url len', url.length, '|', shape);
                } catch (e) {
                  console.log(\`[ERR] \${String(Date.now()-t0).padStart(5)}ms  \${label} -> \${e && e.message}\`);
                }
              }
            })();
          "
